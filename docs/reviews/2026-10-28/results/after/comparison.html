<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;font-family:var(--font-sans);color:var(--foreground)}main{margin:0;padding:0}figure{margin:0 0 18px}figcaption{font-size:14px;font-weight:650;line-height:21px}.detail{font-size:12px;color:var(--muted-foreground);margin:2px 0 7px}.row{display:grid;grid-template-columns:58px minmax(0,1fr) 64px;align-items:center;gap:10px;height:21px;font-size:12px}.track{height:8px;border-radius:var(--radius);background:var(--secondary);overflow:hidden}.bar{height:8px;border-radius:var(--radius)}.before{background:var(--chart-2)}.after{background:var(--chart-1)}strong{font-family:var(--font-mono);font-weight:500;text-align:right}.note{font-size:12px;line-height:18px;color:var(--muted-foreground);margin:8px 0 0}</style></head><body><main><figure><figcaption>Cue object field reads per update</figcaption><p class="detail">50,000 cues · tail playback · median</p><div class="row"><span>Baseline</span><div class="track"><div class="bar before" style="width:100.0%"></div></div><strong>99,920</strong></div><div class="row"><span>Final</span><div class="track"><div class="bar after" style="width:0.0%"></div></div><strong>0</strong></div></figure><figure><figcaption>Model requests for five repeated clicks</figcaption><p class="detail">One unchanged word and sentence</p><div class="row"><span>Baseline</span><div class="track"><div class="bar before" style="width:100.0%"></div></div><strong>5</strong></div><div class="row"><span>Final</span><div class="track"><div class="bar after" style="width:20.0%"></div></div><strong>1</strong></div></figure><figure><figcaption>Translation cache entries</figcaption><p class="detail">After 10,000 unique sentences</p><div class="row"><span>Baseline</span><div class="track"><div class="bar before" style="width:100.0%"></div></div><strong>10,000</strong></div><div class="row"><span>Final</span><div class="track"><div class="bar after" style="width:5.0%"></div></div><strong>500</strong></div></figure><p class="note">Each pair uses its own scale. Cue lookup uses binary searches on a prebuilt numeric index; zero refers to cue-object field reads after installation.</p></main></body></html>
